# Local Supabase stack for development and automated tests (`npx supabase start`).
# The hosted production project is configured in the Supabase dashboard; see DEPLOYMENT.md for the
# matching production settings. Only the services TrichFree uses are enabled here.
#
# DO NOT `supabase config push` THIS FILE TO PRODUCTION: its site URL is localhost and its auth rate limits are
# raised so the tests can sign many users in quickly. Production uses `supabase db push` (migrations) only.
project_id = "trichfree"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

# Captures outgoing auth emails (one-time codes) so tests can read them. Web UI/API on this port.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
# The website's local dev server. Production: your website URL (Dashboard → Auth → URL Configuration).
site_url = "http://127.0.0.1:5174"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

# Generous local limits so the test suite can sign in many times. Production keeps Supabase's defaults.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
# Codes expire after 10 minutes.
otp_expiry = 600

# TrichFree signs in with a 6-digit code (works even if the email is opened on another device).
[auth.email.template.magic_link]
subject = "Your TrichFree sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Your TrichFree sign-in code"
content_path = "./supabase/templates/otp.html"
