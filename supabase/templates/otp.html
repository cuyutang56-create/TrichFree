<!-- Supabase Auth email template for "Magic Link" and "Confirm signup". Paste into Dashboard → Auth → Email Templates. -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; color: #2a2640;">
  <h2 style="font-weight: 600;">Your TrichFree code</h2>
  <p>Enter this code to sign in. It expires in 10 minutes.</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0;">{{ .Token }}</p>
  <p style="color: #6b6785; font-size: 14px;">If you didn't ask for this code, you can ignore this email. Nobody can sign in without the code.</p>
</div>
